server:
  port: 8089
spring:
  application:
    name: "Capacidades"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  data:
    redis:
      host: "localhost"
      port: 6379
  cache:
    type: "redis"
    redis:
      time-to-live: "10m"
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,circuitbreakers"
  endpoint:
    health:
      show-details: "always"
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8082"
routers:
  paths:
    abilities: "/api/v1/capacidades"
    allAbilities: "/api/v1/capacidades/all"
resilience4j:
  circuitbreaker:
    instances:
      externalServiceCB:
        event-consumer-buffer-size: 10
        minimum-number-of-calls: 3
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: "5s"
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
adapters:
  r2dbc:
    host: "localhost"
    port: "5433"
    database: "capacidades"
    schema: "public"
    username: "postgres"
    password: "postgres"
adapter:
  restconsumer:
    timeout: 5000
    url: "http://localhost:8080"
