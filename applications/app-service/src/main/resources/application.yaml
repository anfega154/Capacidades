server:
  port: 8082

spring:
  application:
    name: "Capacidades"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8082"

routers:
  paths:
    abilities: "/api/v1/capacidades"

resilience4j:
  circuitbreaker:
    instances:
      externalServiceCB:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

adapters:
  r2dbc:
    host: "${SPRING_R2DBC_HOST:capacidades-db}"
    port: "${SPRING_R2DBC_PORT:5432}"
    database: "${SPRING_R2DBC_DATABASE:capacidades}"
    schema: "${SPRING_R2DBC_SCHEMA:public}"
    username: "${SPRING_R2DBC_USERNAME:postgres}"
    password: "${SPRING_R2DBC_PASSWORD:postgres}"

